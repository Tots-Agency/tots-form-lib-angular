@if (field.label && totsFormDefaultConfig.labelPosition==eTotsFormLabelPosition.ABOVE) {
	<tots-outer-label
		[label]="field.label"
		[isRequired]="isRequired()"
	></tots-outer-label>
}

@if (input) {
	<mat-form-field class="{{getClases()}}" (click)="picker.open()" [appearance]="getAppearance()" >
		@if (field.label && totsFormDefaultConfig.labelPosition==eTotsFormLabelPosition.INSIDE) {
			<mat-label> {{ field.label }} </mat-label>
		}

		<input matInput [matDatepicker]="picker" [formControl]="input" [placeholder]="getPlaceholder()" [min]="minDate" [max]="maxDate">
		<mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
		<mat-datepicker #picker startView="year" (monthSelected)="closeDatepicker($event, picker)"></mat-datepicker>

		@if (hint) {
			<mat-hint [align]="'end'"> {{ hint }} </mat-hint>
		}

		@if (hasError()) {
			<mat-error> {{ getMessageError() }} </mat-error>
		}
	</mat-form-field>	
}
