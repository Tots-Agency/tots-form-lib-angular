@if (field.label && totsFormDefaultConfig.labelPosition==eTotsFormLabelPosition.ABOVE) {
	<tots-outer-label
		[label]="field.label"
		[isRequired]="isRequired()"
	></tots-outer-label>
}

@if (input) {
	<mat-form-field class="{{getClases()}}" [appearance]="getAppearance()">
		@if (field.label && totsFormDefaultConfig.labelPosition==eTotsFormLabelPosition.INSIDE) {
			<mat-label>
				{{ field.label }}
			</mat-label>
		}

		<textarea matInput [rows]="rows" [formControl]="input" [placeholder]="getPlaceholder()"></textarea>
		
		@if (hint) {
			<mat-hint [align]="'end'">
				{{ hint }}
			</mat-hint>
		}

		@if (hasError()) {
			<mat-error>
				{{ getMessageError() }}
			</mat-error>
		}
	</mat-form-field>
}
