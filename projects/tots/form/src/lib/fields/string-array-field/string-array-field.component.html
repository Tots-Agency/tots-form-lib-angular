<div class="string-array-field-header">
	@if (field.label) {
		<tots-outer-label
			[label]="field.label"
			[isRequired]="isRequired()"
		></tots-outer-label>
	}

	<button mat-button
		[ngClass]="{
			'mat-mdc-button': addButtonStyle=='mat-button',
			'mat-mdc-unelevated-button mdc-button--unelevated': addButtonStyle=='mat-flat-button',
			'mat-mdc-raised-button mdc-button--raised': addButtonStyle=='mat-raised-button',
			'mat-mdc-outlined-button mdc-button--outlined': addButtonStyle=='mat-stroked-button',
		}"
		type="button"
		[class]="addButtonMatColor"
		[disabled]="formArray.controls.length >= maxAmount"
		(click)="addOne()"
	>
		@if (addButtonMatIcon) {
			<mat-icon> {{ addButtonMatIcon }} </mat-icon>
		}
		@if (addButtonCaption) {
			{{addButtonCaption}}
		}
	</button>
</div>

<div>
	@for (control of formArray.controls; track $index) {

	}
	@for (control of formArray.controls; track $index) {
		<mat-form-field class="{{ getClases() }}" [appearance]="getAppearance()">
			<input matInput type="text" [formControl]="getControlByIndex($index)" [placeholder]="getPlaceholder()"/>

			@if ($first && matHint) {
				<mat-hint align="end"> {{ matHint }} </mat-hint>
			}

			@if (hasIndividualError($index)) {
				<mat-error>{{ getIndividualMessageError($index) }}</mat-error>
			}

			@if (!$first) {
				<button mat-icon-button matSuffix class="warn" (click)="removeOne($index)">
					<mat-icon>close</mat-icon>
				</button>
			}
		</mat-form-field>
	}  
</div>
