<div class="string-array-field-header">

	@if (field.label) {
		<tots-outer-label
			[label]="field.label"
			[isRequired]="isRequired()"
		></tots-outer-label>
	}

	<button mat-button [ngClass]="{
			'mat-mdc-button': addButtonStyle=='mat-button',
			'mat-mdc-unelevated-button mdc-button--unelevated': addButtonStyle=='mat-flat-button',
			'mat-mdc-raised-button mdc-button--raised': addButtonStyle=='mat-raised-button',
			'mat-mdc-outlined-button mdc-button--outlined': addButtonStyle=='mat-stroked-button',
		}" type="button" [class]="addButtonMatColor" [disabled]="formArray1.controls.length >= maxAmount" (click)="addOne()">
		@if (addButtonMatIcon) {
			<mat-icon> {{ addButtonMatIcon }} </mat-icon>
		}
		@if (addButtonCaption) {
			{{addButtonCaption}}
		}
	</button>
</div>

<div class="double-string-fields">
	@for (control of formArray1.controls; track $index) {
		<div class="pair" class="{{getClases()}}">
			<mat-form-field [appearance]="getAppearance()">
				<input matInput type="text" [formControl]="getControlByIndex1($index)" [placeholder]="getPlaceholder()"/>
				@if (hasIndividualError1($index)) {
					<mat-error>{{getIndividualMessageError1($index)}}</mat-error>
				}
			</mat-form-field>
		
			<mat-form-field [appearance]="getAppearance()">
				<input matInput type="text" [formControl]="getControlByIndex2($index)" [placeholder]="placeholder2" />

				@if ($first && matHint) {
					<mat-hint [align]="'end'"> {{matHint}} </mat-hint>
				}

				@if (hasIndividualError2($index)) {
					<mat-error>{{getIndividualMessageError2($index)}}</mat-error>
				}
		
				@if (!$first) {
					<button mat-icon-button matSuffix color="warn" (click)="removeOne($index)">
						<mat-icon>close</mat-icon>
					</button>
				}

			</mat-form-field>
		</div>
	}
	
</div>
