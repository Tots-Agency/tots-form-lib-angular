@if (field.label) {
	<tots-outer-label
		[label]="field.label"
		[isRequired]="isRequired()"
	></tots-outer-label>
}

<mat-radio-group [formControl]="input" [ngClass]="{vertical: alignment=='vertical'}">
	@for (o of options; track $index) {
		<mat-radio-button [value]="o.value">
			{{o.caption}}
		</mat-radio-button>
	}
</mat-radio-group>
