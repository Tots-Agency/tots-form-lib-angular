@if (field.label && totsFormDefaultConfig.labelPosition==eTotsFormLabelPosition.ABOVE) {
	<tots-outer-label
		[label]="field.label"
		[isRequired]="isRequired()"
	></tots-outer-label>
}

@if (input) {
	<mat-form-field class="{{getClases()}}" [appearance]="getAppearance()">
		@if (field.label && totsFormDefaultConfig.labelPosition==eTotsFormLabelPosition.INSIDE) {
			<mat-label> {{ field.label }} </mat-label>
		}

		<input matInput [type]="showPassword && group.enabled ? 'text' : 'password'" [formControl]="input" [placeholder]="getPlaceholder()"/>

		<button mat-icon-button matSuffix type="button" (click)="togglePassword($event)" tabindex="-1" [disabled]="group.disabled">
			<mat-icon>{{showPassword ? "visibility_off" : "visibility"}}</mat-icon>
		</button>

		@if (getCaption()) {
			<mat-hint [align]="'end'"> {{getCaption()}} </mat-hint>
		}

		@if (hasError()) {
			<mat-error> {{getMessageError()}} </mat-error>
		}
	</mat-form-field>
}
