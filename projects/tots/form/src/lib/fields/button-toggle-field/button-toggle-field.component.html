@if (field.label) {
	<tots-outer-label
		[label]="field.label"
		[isRequired]="isRequired()"
	></tots-outer-label>
}

<mat-button-toggle-group [formControl]="input">
	@for (option of field.extra.options; track $index) {
		<mat-button-toggle [value]="option.id">{{ option.title }}</mat-button-toggle>
	}
</mat-button-toggle-group>
