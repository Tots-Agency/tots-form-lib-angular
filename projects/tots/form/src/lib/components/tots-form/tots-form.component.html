<form [formGroup]="group">
	<div class="tots-form-print">

		@for (field of fields; track $index) {
			<div class="tots-field-main-container">

				@if (isHasIcon(field)) {
					<mat-icon>
						{{ getIconField(field) }}
					</mat-icon>
				}
				<div class="tots-field-print-container">
					<tots-base-print-field [field]="field" [group]="group" [onAction]="privateActions"></tots-base-print-field>
				</div>
			</div>
		}

	</div>
</form>
