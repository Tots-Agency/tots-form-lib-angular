<button mat-raised-button [matMenuTriggerFor]="menuFilter">
    <mat-icon>today</mat-icon> &nbsp;
    @switch (filterType) {
      @case (1) { This day }
      @case (2) { This week }
      @case (3) { This month }
      @case (4) { This year }
      @case (5) { {{ rangeString }} }
    }
    &nbsp;
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

<mat-menu #menuFilter="matMenu" class="mat-menu-filter-date">
    <button mat-menu-item (click)="filterByDay()">This day</button>
    <button mat-menu-item (click)="filterByWeek()">This week</button>
    <button mat-menu-item (click)="filterByMonth()">This month</button>
    <button mat-menu-item (click)="filterByYear()">This year</button>
    <mat-divider style="margin: 0 !important;"></mat-divider>
    <div style="padding: 0 1em;" (click)="$event.stopPropagation()">
      <p>Select date range</p>
      <mat-form-field appearance="outline" (click)="picker.open()">
        <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
          <input matStartDate formControlName="start" placeholder="Start date">
          <input matEndDate formControlName="end" placeholder="End date">
        </mat-date-range-input>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-date-range-picker #picker></mat-date-range-picker>
      </mat-form-field>
    </div>
</mat-menu>
